github:
  apiBaseUrl: https://api.github.com

assetBlacklistPatterns:
  - "*.yaml"
  - "*.yml"

metadataStorage:
  prefix: release-sync
  releaseSelector: latest-draft

concurrency:
  workflowMaxParallel: 2
  maxParallelAssets: 2

providers:
  pan123:
    errorDetailLevel: diagnostic
    apiBaseUrl: https://open-api.123pan.com
    containDir: false
    singleStepUpload: false

repositories:
  - owner: microsoft
    repo: PowerToys
    assetExcludePatterns:
      - "*symbols*"
    targets:
      - name: 123pan
        provider: 123pan
        targetDirectory: /syncer/powertoys

  - owner: PowerShell
    repo: PowerShell
    targets:
      - name: 123pan
        provider: 123pan
        targetDirectory: /syncer/powershell
